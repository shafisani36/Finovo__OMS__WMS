; /etc/supervisor/conf.d/finovo.conf: queue workers (emails, store updates, webhooks, store sync).
; Start with: sudo supervisorctl reread && sudo supervisorctl update
[program:finovo-worker]
command=php /var/www/finovo/backend/artisan queue:work --sleep=1 --tries=3 --backoff=10 --max-time=3600 --timeout=120
process_name=%(program_name)s_%(process_num)02d
numprocs=4
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/finovo/backend/storage/logs/worker.log
