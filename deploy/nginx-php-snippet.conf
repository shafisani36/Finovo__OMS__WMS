# /etc/nginx/snippets/finovo-php.conf: hands a request to Laravel (PHP-FPM).
root /var/www/finovo/backend/public;
fastcgi_pass finovo_php;
fastcgi_keep_conn on;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param DOCUMENT_ROOT $document_root;
include fastcgi_params;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
# A request is answered within 60 seconds or stopped; heavy work runs on the queue, never in a request.
fastcgi_connect_timeout 5s;
fastcgi_send_timeout 60s;
fastcgi_read_timeout 60s;
