; /etc/php/8.3/fpm/pool.d/finovo.conf: PHP workers for Finovo.
; Each worker uses about 40-60 MB. pm.max_children = (RAM for PHP in MB) / 60, e.g. 8 GB server with 5 GB for PHP: 80.
[finovo]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-finovo.sock
listen.owner = www-data
listen.group = www-data
listen.backlog = 4096

pm = static
pm.max_children = 80
pm.max_requests = 1000

; Stop a request that runs too long, so one slow call never holds a worker forever.
request_terminate_timeout = 65s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-finovo-slow.log

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
php_admin_value[expose_php] = Off

; OPcache: code is compiled once and kept in memory (deploy.sh reloads PHP-FPM after each release).
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.max_accelerated_files] = 30000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600
