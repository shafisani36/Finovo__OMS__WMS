# Finovo OMS / WMS: nginx for one app server (copy to /etc/nginx/sites-available/finovo and link it in sites-enabled).
# Replace app.yourdomain.com, api.yourdomain.com and /var/www/finovo with your own; HTTPS certificates from certbot.

# Traffic control per visitor address: the API and the public pages each get a steady rate with a short burst;
# anything above gets 429 at once instead of piling up and slowing the server for everyone.
limit_req_zone $binary_remote_addr zone=finovo_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=finovo_public:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=finovo_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Behind Cloudflare or a load balancer, take the visitor address from it (list its address ranges):
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;

upstream finovo_php {
    server unix:/run/php/php8.3-fpm-finovo.sock;
    keepalive 32;
}

server {
    listen 80;
    server_name app.yourdomain.com api.yourdomain.com;
    return 301 https://$host$request_uri;
}

# The app people use: the React build, with /api, /sanctum and /up passed to Laravel.
server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;
    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    root /var/www/finovo/Frontend/dist;
    index index.html;

    client_max_body_size 10m;
    limit_conn finovo_conn 60;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Built files carry a hash in their name, so browsers keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and the service worker are always checked again, so a new release shows at once.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    location ^~ /api/v1/public/ {
        limit_req zone=finovo_public burst=10 nodelay;
        include /etc/nginx/snippets/finovo-php.conf;
    }

    location ~ ^/api/v1/auth/(login|forgot-password|otp|password) {
        limit_req zone=finovo_public burst=10 nodelay;
        include /etc/nginx/snippets/finovo-php.conf;
    }

    location ~ ^/(api|sanctum|up)(/|$) {
        limit_req zone=finovo_api burst=60 nodelay;
        include /etc/nginx/snippets/finovo-php.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}

# The address stores and couriers call (webhooks, sign-in callbacks); Laravel only.
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    root /var/www/finovo/backend/public;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/json;

    location / {
        limit_req zone=finovo_api burst=120 nodelay;
        include /etc/nginx/snippets/finovo-php.conf;
    }
}
